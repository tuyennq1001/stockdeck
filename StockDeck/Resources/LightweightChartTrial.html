<style>
#indicatorFields{max-height:min(62vh,620px);overflow:auto;padding:2px 1px}
#indicatorFields .rsi-setting-group{margin:14px 0 8px;padding-top:10px}
.ma-setting-row{grid-template-columns:22px 48px 78px minmax(90px,1fr) 82px 88px 82px;gap:7px;min-height:58px}
.ma-setting-row .ma-period,.ma-setting-row .ma-source{width:100%;min-width:0;height:34px;padding:4px 6px;border:1px solid #8885;border-radius:6px;background:Canvas;color:inherit}
.ma-setting-row .style-color{width:100%}.ma-setting-row .style-color i{width:58px}
.ma-setting-row .style-opacity{font-size:10px;white-space:nowrap}
.opacity-help{display:block;margin-top:5px;color:#777;font-size:10px}
/* Compact settings keep chart space visible; long forms scroll inside fixed actions. */
#indicatorDialog{width:min(480px,calc(100vw - 28px));max-height:min(400px,calc(100dvh - 28px));overflow:hidden}
#indicatorDialog form{container-type:inline-size;display:flex;flex-direction:column;max-height:min(398px,calc(100dvh - 30px));padding:12px}
#indicatorDialog .dialog-title-row,#indicatorDialog #rsiTabs,#indicatorDialog .dialog-actions{flex-shrink:0}
#indicatorDialog #indicatorFields{min-height:0;flex:1 1 auto;overflow:auto}
@container(max-width:560px){
  .style-row{grid-template-columns:22px minmax(70px,1fr) 76px 86px 72px;gap:5px}
  .style-color i{width:54px}.style-name{font-size:11px}.form-field{grid-template-columns:1fr minmax(100px,45%)}
  .ma-setting-row{grid-template-columns:20px 42px 62px minmax(78px,1fr) 60px 68px;gap:4px;padding-inline:2px}
  .ma-setting-row .style-opacity{grid-column:2/-1;margin-top:-5px}.ma-setting-row .style-color i{width:42px}
}
@media(max-width:560px){.ma-setting-row{grid-template-columns:20px 42px 62px minmax(78px,1fr) 60px 68px;gap:4px;padding-inline:2px}.ma-setting-row .style-opacity{grid-column:2/-1;margin-top:-5px}.ma-setting-row .style-color i{width:42px}}

.range-bar{grid-column:2;grid-row:3;display:flex;align-items:center;gap:4px;min-height:34px;padding:3px 6px;border-top:1px solid #8882;white-space:nowrap;overflow-x:auto}
.range-bar[hidden]{display:none}.range-bar button,.range-bar summary{border:0;background:transparent;color:inherit;padding:5px 7px;border-radius:4px;cursor:pointer;font:inherit}
#rangePresets,#intervalFavorites{display:flex;align-items:center;gap:2px}.range-bar button:hover{background:#8882}.range-bar button[aria-pressed=true]{background:#8882;color:#16816d;font-weight:600}.range-bar button:disabled{opacity:.35;cursor:default}

<body><div id="app">
  <div class="toolbar" role="toolbar" aria-label="Điều khiển biểu đồ">
    <div id="intervalFavorites" class="time-control" role="group" aria-label="Khung nến yêu thích"></div>
    <details class="menu time-control" id="intervalMenu"><summary id="intervalLabel" aria-label="Chọn khung nến">D ▾</summary><div class="menu-panel" id="intervalOptions"></div></details>
    <span class="separator time-control"></span>
    <details class="menu" id="chartTypeMenu"><summary id="chartTypeLabel" title="Kiểu chart" aria-label="Kiểu chart">Nến ▾</summary><div class="menu-panel">
      <div class="menu-group"><div class="menu-title">KIỂU HIỂN THỊ</div><button id="candleType" type="button">✓ Nến</button><button id="lineType" type="button">Đường</button></div>
      <div class="menu-group"><div class="menu-title">THANG GIÁ</div><button id="linearScale" type="button">✓ Tuyến tính</button><button id="logScale" type="button">Log</button></div>
    </div></details>
    <details class="menu" id="indicatorMenu"><summary id="indicatorLabel" title="Chỉ báo" aria-label="Chỉ báo">Chỉ báo ▾</summary><div class="menu-panel">
      <div class="menu-group"><div class="menu-title">ĐƯỜNG GIÁ</div>
        <label data-superchart-option><input type="checkbox" data-ind="SMA" checked> SMA</label><label data-superchart-option><input type="checkbox" data-ind="EMA"> EMA</label>
        <label><input type="checkbox" data-ind="BB"> <span id="bbMenuSummary">Bollinger Bands 20/2</span></label>
        <label data-superchart-option><input type="checkbox" data-ind="SAR"> Parabolic SAR</label>
      </div>
      <div class="menu-group"><div class="menu-title">PANE</div>
        <label><input type="checkbox" data-ind="RSI" checked> RSI <span id="rsiSummary">14 · 30/70</span></label>
        <label><input type="checkbox" data-ind="MACD" checked> MACD <span id="macdSummary">12/26/9</span></label>
        <label data-superchart-option><input type="checkbox" data-ind="Stochastic"> Stochastic <span id="stochasticSummary">14/3/3 · 20/80</span></label>
      </div>
    </div></details>
    <details class="menu" id="pineScriptsMenu" hidden><summary id="pineScriptsLabel" title="Scripts" aria-label="Scripts">Scripts ▾</summary><div class="menu-panel" id="pineScriptsOptions"></div></details>
    <button id="insiderToggle" title="Bật/tắt dấu mua bán insider" aria-label="Bật/tắt dấu mua bán insider">Mua/Bán</button>
    <details class="menu" id="displayMenu"><summary id="displayLabel" title="Hiển thị" aria-label="Hiển thị">Hiển thị ▾</summary><div class="menu-panel">
      <div class="menu-group"><div class="menu-title">DỮ LIỆU</div><label><input type="checkbox" data-series="Volume" checked> Volume</label><label><input type="checkbox" data-series="Target" checked> Giá mục tiêu mua</label></div>
      <div class="menu-group"><div class="menu-title">PANE</div><select id="focusPane" title="Phóng to khung"><option value="0">Toàn chart</option></select><button id="restorePanes" title="Khôi phục kích thước các pane" disabled>Khôi phục pane</button></div>
    </div></details>
    <button id="resetView" type="button" title="Đặt lại góc nhìn" aria-label="Đặt lại góc nhìn">Đặt lại</button><span class="separator"></span>
    <div id="drawingTools" hidden><button id="deleteRange" title="Xóa hình đang chọn" disabled>Xóa</button><button id="lockDrawing" title="Khóa/mở khóa hình đang chọn" disabled>Khóa</button><input id="drawingColor" type="color" value="#1a9b82" title="Màu hình vẽ" style="width:24px;height:24px;border:0;background:transparent;padding:0"><select id="drawingWidth" title="Độ dày"><option value="1">1px</option><option value="2">2px</option><option value="3">3px</option></select><span id="saveState"></span></div>
  </div>
  <div class="draw-rail" aria-label="Công cụ vẽ">
    <button data-tool="select" class="selected" title="Chọn và sửa">↖</button>
    <button data-tool="horizontal" title="Đường ngang">━</button>
    <button data-tool="trend" title="Đường xu hướng">／</button>
    <button data-tool="rectangle" title="Hình chữ nhật">▱</button>
    <button data-tool="range" title="Price Range">↕</button>
    <span class="rail-separator"></span>
    <button id="undo" title="Hoàn tác (⌘Z)" disabled>↶</button>
