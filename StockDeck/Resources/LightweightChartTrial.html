@container(max-width:560px){
  .style-row{grid-template-columns:22px minmax(70px,1fr) 76px 86px 72px;gap:5px}
  .style-color i{width:54px}.style-name{font-size:11px}.form-field{grid-template-columns:1fr minmax(100px,45%)}
  .ma-setting-row{grid-template-columns:20px 42px 62px minmax(78px,1fr) 60px 68px;gap:4px;padding-inline:2px}
  .ma-setting-row .style-opacity{grid-column:2/-1;margin-top:-5px}.ma-setting-row .style-color i{width:42px}
}
@media(max-width:560px){.ma-setting-row{grid-template-columns:20px 42px 62px minmax(78px,1fr) 60px 68px;gap:4px;padding-inline:2px}.ma-setting-row .style-opacity{grid-column:2/-1;margin-top:-5px}.ma-setting-row .style-color i{width:42px}}

.range-bar{grid-column:2;grid-row:3;display:flex;align-items:center;gap:4px;min-height:34px;padding:3px 6px;border-top:1px solid #8882;white-space:nowrap;overflow-x:auto}
.range-bar[hidden]{display:none}.range-bar button,.range-bar summary{border:0;background:transparent;color:inherit;padding:5px 7px;border-radius:4px;cursor:pointer;font:inherit}
#rangePresets,#intervalFavorites{display:flex;align-items:center;gap:2px}.range-bar button:hover{background:#8882}.range-bar button[aria-pressed=true]{background:#8882;color:#16816d;font-weight:600}.range-bar button:disabled{opacity:.35;cursor:default}
#rangeStatus{font-size:10px;color:#777;margin-left:6px}.interval-row{display:flex;align-items:center;gap:2px}.interval-row>button:first-child{flex:1;text-align:left}.interval-row .favorite-toggle{width:28px;flex:0 0 28px;text-align:center}.favorite-toggle[aria-pressed=true]{color:#16816d}.interval-row .current-interval{background:#8882;color:#16816d;font-weight:600}
#intervalMenu .menu-panel{max-height:min(480px,80vh);overflow-y:auto;min-width:190px}#customRangeDialog{width:340px;max-width:calc(100vw - 28px)}#customRangeDialog form{padding:18px}#customRangeDialog label{display:grid;grid-template-columns:75px 1fr;align-items:center;gap:8px;margin:14px 0}#customRangeDialog input{min-width:0;padding:8px;border:1px solid #8885;border-radius:5px;background:Canvas;color:inherit;font:inherit}#customRangeError{color:#c44;font-size:11px}#customCoverage{font-size:11px}.range-bar .menu-panel{z-index:60}
#intervalFavorites{max-width:40%;min-width:0;overflow-x:auto}#intervalFavorites button{flex:0 0 auto}#customRangeForm button[type=submit]{background:#16816d;border-color:#16816d;color:white}
</style>
<script src="LightweightCharts/lightweight-charts.js"></script>
<script src="CustomPineChart.js"></script>
</head>
<body><div id="app">
  <div class="toolbar" role="toolbar" aria-label="Điều khiển biểu đồ">

      </div>
      <div class="menu-group"><div class="menu-title">PANE</div>

        <button type="button" class="indicator-add-btn" data-ind="MACD">MACD <span id="macdSummary" class="menu-subtext">12/26/9</span></button>
        <button type="button" class="indicator-add-btn" data-ind="Stochastic" data-superchart-option>Stochastic <span id="stochasticSummary" class="menu-subtext">14/3/3 · 20/80</span></button>
      </div>
    </div></details>

    </div></details>

    <button id="redo" title="Làm lại (⌘⇧Z)" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg></button>
  </div>
  <div id="drawFlyout" class="flyout-menu" role="menu"><div id="flyoutTitle" class="flyout-title"></div><div id="flyoutItems"></div></div>
  <div id="pinTooltip" class="pin-tooltip" hidden><div class="pin-tooltip-header"><span class="pin-tooltip-title">📌 Ghi chú</span><span class="pin-tooltip-date" id="pinTooltipDate"></span></div><p class="pin-tooltip-body" id="pinTooltipBody"></p></div>
  <div id="chart">
    <canvas id="drawing-layer"></canvas>
    <div id="drawingTools" class="drawing-floating-toolbar" hidden>
      <div id="drawingDragHandle" class="floating-drag-handle" title="Kéo để di chuyển thanh công cụ">⠿</div>
      <button id="drawingColorBtn" type="button" class="drawing-color-btn" title="Màu sắc hình vẽ"><span id="drawingColorSwatch"></span></button>
      <input id="drawingColor" type="hidden" value="auto">
      <button id="drawingFontColorBtn" type="button" class="drawing-color-btn" title="Màu chữ" hidden><span id="drawingFontColorSwatch">A</span></button>
      <input id="drawingFontColor" type="hidden" value="#eeeeee">
      <button id="drawingFontSizeBtn" type="button" class="floating-btn floating-btn-icon" title="Cỡ chữ (13px)" hidden><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg><span id="drawingFontSizeLabel" class="visually-hidden">13px</span></button>
      <select id="drawingFontSize" title="Cỡ chữ" style="display:none"><option value="9">9px</option><option value="10">10px</option><option value="11">11px</option><option value="12">12px</option><option value="13">13px</option><option value="14">14px</option><option value="16">16px</option><option value="18">18px</option><option value="20">20px</option><option value="24">24px</option></select>
      <button id="drawingWidthBtn" type="button" class="floating-btn floating-btn-icon" title="Độ dày đường nét (1px)"><span id="drawingWidthPreview" class="width-stroke-preview" style="width:18px;border-top-width:1px"></span><span id="drawingWidthLabel" class="visually-hidden">1px</span></button>
      <select id="drawingWidth" title="Độ dày đường nét" style="display:none"><option value="1">1px</option><option value="2">2px</option><option value="3">3px</option><option value="4">4px</option></select>
      <button id="drawingLineStyleBtn" type="button" class="floating-btn floating-btn-icon" title="Kiểu nét: Liền"><span id="drawingLineStylePreview" class="style-stroke-preview" style="width:18px;border-top-style:solid"></span><span id="drawingLineStyleLabel" class="visually-hidden">Liền</span></button>
      <select id="drawingLineStyle" title="Kiểu nét" style="display:none"><option value="solid">― Liền</option><option value="dashed">┄ Đứt</option><option value="dotted">┈ Chấm</option></select>

      <button id="editDrawingText" class="floating-btn floating-btn-icon" title="Sửa nội dung văn bản / ghi chú" type="button" hidden><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
      <span class="floating-sep"></span>
      <button id="lockDrawing" class="lock-btn floating-btn-icon" title="Khóa / Mở khóa hình vẽ" disabled><svg class="icon-lock" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span id="lockDrawingLabel" class="visually-hidden">Khóa</span></button>
      <button id="duplicateDrawing" class="dup-btn floating-btn-icon" title="Nhân bản / Sao chép hình vẽ (⌘D)" type="button" disabled><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button id="deleteRange" class="danger floating-btn-icon" title="Xóa hình đang chọn (Delete)" disabled><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>
    <div id="inlineDrawingEditor" class="inline-drawing-editor" hidden>
      <div class="inline-editor-bubble">
        <textarea id="inlineDrawingInput" rows="1" placeholder="Nhập ghi chú..." spellcheck="false" maxlength="1000"></textarea>
        <div class="inline-editor-tail" id="inlineEditorTail"></div>
      </div>
    </div>
    <button id="collapseIndicators" class="legend-collapse" type="button" aria-label="Thu gọn chỉ báo" title="Thu gọn chỉ báo" aria-expanded="true" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button><div id="candleReadout" aria-label="Thông tin nến" hidden><span class="candle-readout-time" data-candle-time></span><span class="candle-readout-field" data-field="open"><b>O</b> <i></i></span><span class="candle-readout-field" data-field="high"><b>H</b> <i></i></span><span class="candle-readout-field" data-field="low"><b>L</b> <i></i></span><span class="candle-readout-field" data-field="close"><b>C</b> <i></i></span><span class="candle-readout-field" data-field="change"><b>Δ</b> <i></i></span><span class="candle-readout-field" data-field="changePercent"><b>Δ%</b> <i></i></span><span class="candle-readout-field" data-field="volume"><b>KL</b> <i></i></span></div><div id="indicatorLegend" aria-label="Chỉ báo đang hiển thị"></div></div>
  <div id="rangeBar" class="range-bar" role="toolbar" aria-label="Khoảng xem" hidden>
    <div id="rangePresets"></div>
    <details class="menu" id="rangeMenu"><summary id="rangeLabel" aria-label="Các khoảng xem khác">···</summary><div class="menu-panel"><div id="rangeOptions" class="menu-group"></div></div></details>
    <button id="customRangeButton" type="button" title="Chọn khoảng ngày" aria-label="Custom range"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18m-12 5h6"/></svg></button>

  <div id="error"></div>
  <div id="paneReadout" aria-live="polite"></div>
</div>

  <div class="dialog-title-row"><h3 id="customRangeTitle">Custom range</h3><button class="dialog-close" type="button" id="closeCustomRange" aria-label="Đóng">×</button></div>

<dialog id="indicatorDialog"><form method="dialog" id="indicatorForm"><div class="dialog-title-row"><h3 id="dialogTitle">Cài đặt chỉ báo</h3><button id="closeIndicator" class="dialog-close" type="button" aria-label="Đóng">×</button></div><div id="rsiTabs" role="tablist" aria-label="Cài đặt RSI" hidden><button type="button" role="tab" data-rsi-tab="inputs" aria-selected="true">Inputs</button><button type="button" role="tab" data-rsi-tab="style" aria-selected="false">Style</button><button type="button" role="tab" data-rsi-tab="visibility" aria-selected="false">Visibility</button></div><div id="indicatorFields"></div><p id="indicatorPreviewStatus" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="cancelIndicator" type="button">Hủy</button><button id="resetIndicator" type="button">Mặc định</button></div></form></dialog>

<script>
(() => {
  const C=window.LightweightCharts,host=document.getElementById('chart'),canvas=document.getElementById('drawing-layer'),ctx=canvas.getContext('2d');
  if(!C){const e=document.getElementById('error');e.style.display='block';e.textContent='Không tải được thư viện chart.';return;}
  const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const surface=window.stockDeckChartSurface==='superchart'?'superchart':'detail';
  const storageKey=name=>surface==='superchart'?`stockdeck.chart.superchart.${name}.v1`:`stockdeck.chart.${name}.v1`;
  const readStorage=name=>{if(typeof window.stockDeckPreferences?.[name]==='string')return window.stockDeckPreferences[name];try{const value=localStorage.getItem(storageKey(name));if(value!==null)return value;if(surface==='superchart'){const legacy=localStorage.getItem(`stockdeck.chart.${name}.v1`);if(legacy!==null)localStorage.setItem(storageKey(name),legacy);return legacy;}return null;}catch{return null;}};
  const writeStorage=(name,value)=>{if(window.stockDeckPreferences?.[name]===value)return;window.stockDeckPreferences={...(window.stockDeckPreferences||{}),[name]:value};try{localStorage.setItem(storageKey(name),value);}catch{}window.webkit?.messageHandlers?.chart?.postMessage({type:'chartPreferenceChanged',name,value});};
  let initialLog=false;try{initialLog=!!JSON.parse(readStorage('display')||'{}').logScale}catch{}
  const chart=C.createChart(host,{autoSize:true,layout:{background:{type:C.ColorType.Solid,color:'transparent'},textColor:dark?'#d7dce5':'#596273',panes:{enableResize:true}},grid:{vertLines:{color:dark?'#ffffff12':'#18223812'},horzLines:{color:dark?'#ffffff12':'#18223812'}},rightPriceScale:{borderVisible:false,mode:initialLog?C.PriceScaleMode.Logarithmic:C.PriceScaleMode.Normal},timeScale:{borderVisible:false,timeVisible:false},handleScroll:{mouseWheel:false,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},handleScale:{mouseWheel:true,pinch:true},crosshair:{mode:C.CrosshairMode.Normal}});
  const candles=chart.addSeries(C.CandlestickSeries,{upColor:'#1a9b82',downColor:'#d94b59',borderVisible:false,wickUpColor:'#1a9b82',wickDownColor:'#d94b59'});
  let volume=null,rsi=null,rsiFill=null,macd=null,signal=null,histogram=null,stochasticK=null,stochasticD=null,sar=null;
  const defaults={enabled:['SMA','RSI','MACD'],volume:true,target:true};
  let saved={};try{saved=JSON.parse(readStorage('display')||'{}')}catch{}
  const enabled=new Set(Array.isArray(saved.enabled)?saved.enabled:defaults.enabled),hiddenIndicators=new Set(Array.isArray(saved.hiddenIndicators)?saved.hiddenIndicators:[]),deletedIndicators=new Set(Array.isArray(saved.deletedIndicators)?saved.deletedIndicators.filter(name=>typeof name==='string'):[]),visibility={volume:saved.volume??defaults.volume,target:saved.target??defaults.target};let indicatorsCollapsed=!!saved.collapsedIndicators;
  for(const name of deletedIndicators){enabled.delete(name);hiddenIndicators.delete(name);}
  const isVisible=name=>{const group=name.startsWith('MA:')?name.slice(3):name;if(['SMA','EMA'].includes(group))return enabled.has(group)&&!hiddenIndicators.has(group);return enabled.has(name)&&!hiddenIndicators.has(name);};
  const builtInMAs=new Set(['SMA 20','SMA 50','SMA 100','SMA 200','EMA 20','EMA 50','EMA 100','EMA 200']);
  let customIndicators=[];try{customIndicators=JSON.parse(readStorage('indicators')||'[]')}catch{}if(!Array.isArray(customIndicators))customIndicators=[];
  const maPeriods=[20,50,100,200],maColors=['#c18c2c','#506fc4','#219875','#9b59b6'],priceColors=Object.fromEntries(maPeriods.map((period,index)=>[String(period),maColors[index]]));
  const movingAverageKey=item=>`${item.name}|${item.type||'SMA'}|${item.source||'close'}`,movingAverageStyleKey=item=>`${(item.type||'SMA').toLowerCase()}${Number(item.slot||item.name.split(' ').at(-1))}`;

  let toolbarCustomPos=null,previousSelectedId=null;
  function updateFloatingToolbarPosition(){
    const toolsBar=document.getElementById('drawingTools');
    if(!toolsBar||toolsBar.hidden||!selectedId)return;
    const d=drawings.find(x=>x.id===selectedId);
    if(!d){toolsBar.hidden=true;return;}

    const barW=toolsBar.offsetWidth||280;
    const barH=toolsBar.offsetHeight||32;
    const chartW=canvas.clientWidth;
    const chartH=canvas.clientHeight;

    if(toolbarCustomPos){
      const x=Math.max(6,Math.min(chartW-barW-6,toolbarCustomPos.x));
      const y=Math.max(6,Math.min(chartH-barH-6,toolbarCustomPos.y));
      toolsBar.style.left=`${Math.round(x)}px`;
      toolsBar.style.top=`${Math.round(y)}px`;
      return;
    }

    let [x0,x1,y0,y1]=coords(d);
    if(x0===null&&x1===null){
      toolsBar.style.left=`${Math.round(Math.max(6,(chartW-barW)/2))}px`;
      toolsBar.style.top='28px';
      return;
    }
    const kind=d.kind||'range';
    let left=x0,right=x1,top=y0,bottom=y1;
    if(kind==='horizontal'){
      left=0;right=canvas.clientWidth;top=bottom=y0;
    }else if(kind==='horizontalRay'){
      left=x0;right=canvas.clientWidth;top=bottom=y0;
    }else if(kind==='vertical'){
      left=right=x0;top=0;bottom=canvas.clientHeight;
    }else if(kind==='pin'){
      const fSize=Number(d.fontSize)||12;
      const bubbleH=Math.max(22,fSize+10),tailH=6;
      left=right=x0;
      top=Math.min(y0-10-tailH-bubbleH,y0-48);
      bottom=y0+14;
    }else if(kind==='text'||kind==='priceLabel'){
      left=right=x0;top=bottom=y0;
    }else{
      left=Math.min(x0,x1);right=Math.max(x0,x1);
      top=Math.min(y0,y1);bottom=Math.max(y0,y1);
    }

    const GAP=kind==='pin'?18:28;
    let targetX=(left+right)/2-barW/2;
    let targetY=(top-barH-GAP);
    if(targetY<8){
      targetY=Math.min(chartH-barH-8,bottom+GAP);
    }
    targetX=Math.max(6,Math.min(chartW-barW-6,targetX));
    targetY=Math.max(6,Math.min(chartH-barH-8,targetY));

    toolsBar.style.left=`${Math.round(targetX)}px`;
    toolsBar.style.top=`${Math.round(targetY)}px`;
  }
  function closeAllDrawingPopovers(except=null){

      if(n===except)return;
      if(typeof n._cleanup==='function')n._cleanup();
      else n.remove();
    });
  }
  function updateDeleteButtons(){
    const selected=drawings.find(d=>d.id===selectedId);
    const toolsBar=document.getElementById('drawingTools');
    toolsBar.hidden=!selected;
    if(!selected){
      toolbarCustomPos=null;
      previousSelectedId=null;
      closeAllDrawingPopovers();
      const colInput=document.getElementById('drawingColor');if(colInput)colInput.value='auto';
      const fontColInput=document.getElementById('drawingFontColor');if(fontColInput)fontColInput.value='#ffffff';
      updateColorSwatchUI('auto','#ffffff');
      document.getElementById('undo').disabled=!undoStack.length;
      document.getElementById('redo').disabled=!redoStack.length;
      return;
    }
    if(selectedId!==previousSelectedId){
      toolbarCustomPos=null;
      previousSelectedId=selectedId;
      closeAllDrawingPopovers();
    }
    const isLocked=!!selected.isLocked;
    const kind=selected.kind||'range';

    const isTrend=kind==='trend';
    const isRange=['range','dateRange','datePriceRange'].includes(kind);
    const isLine=['trend','arrow','horizontal','horizontalRay','vertical','rectangle'].includes(kind);
    const isLineOrShape=isLine||isRange;
    const isNote=kind==='pin';
    const isText=kind==='text';

    const colorBtn=document.getElementById('drawingColorBtn');
    colorBtn.title=isNote?'Màu ghim & ghi chú':'Màu sắc';
    colorBtn.hidden=false;

    const fontColorBtn=document.getElementById('drawingFontColorBtn');
    if(fontColorBtn)fontColorBtn.hidden=!(isText||isRange||isNote);

    const showFont=isText||isRange||isNote;
    const fontSizeBtn=document.getElementById('drawingFontSizeBtn');
    if(fontSizeBtn)fontSizeBtn.hidden=!showFont;
    const fontSizeSelect=document.getElementById('drawingFontSize');
    const isRangeTool=['range','dateRange','datePriceRange','ruler'].includes(selected.kind);
    const defaultSizeForSelected=isRangeTool?10:(isNote?12:13);
    const curFontSize=(selected.fontSize!==undefined&&selected.fontSize!==null&&!(isRangeTool&&selected.fontSize===13))?selected.fontSize:defaultSizeForSelected;
    if(fontSizeSelect){
      fontSizeSelect.hidden=true;
      fontSizeSelect.value=String(curFontSize);
    }
    const fontSizeLabel=document.getElementById('drawingFontSizeLabel');
    if(fontSizeLabel)fontSizeLabel.textContent=`${curFontSize}px`;
    if(fontSizeBtn)fontSizeBtn.title=`Cỡ chữ (${curFontSize}px)`;

    const widthBtn=document.getElementById('drawingWidthBtn');
    if(widthBtn)widthBtn.hidden=!isLineOrShape;
    const widthSelect=document.getElementById('drawingWidth');
    const curWidth=selected.lineWidth||1;
    if(widthSelect){
      widthSelect.hidden=true;
      widthSelect.value=String(curWidth);
    }
    const widthLabel=document.getElementById('drawingWidthLabel');
    if(widthLabel)widthLabel.textContent=`${curWidth}px`;
    const widthPreview=document.getElementById('drawingWidthPreview');
    if(widthPreview)widthPreview.style.borderTopWidth=`${curWidth}px`;
    if(widthBtn)widthBtn.title=`Độ dày đường nét (${curWidth}px)`;

    const styleBtn=document.getElementById('drawingLineStyleBtn');
    if(styleBtn)styleBtn.hidden=!isLineOrShape;
    const styleSelect=document.getElementById('drawingLineStyle');
    const curStyle=selected.lineStyle||'solid';
    if(styleSelect){
      styleSelect.hidden=true;
      styleSelect.value=curStyle;
    }
    const styleText=curStyle==='dashed'?'Đứt':(curStyle==='dotted'?'Chấm':'Liền');
    const styleLabel=document.getElementById('drawingLineStyleLabel');
    if(styleLabel)styleLabel.textContent=styleText;
    const stylePreview=document.getElementById('drawingLineStylePreview');
    if(stylePreview)stylePreview.style.borderTopStyle=curStyle;
    if(styleBtn)styleBtn.title=`Kiểu nét: ${styleText}`;

    const extendBtn=document.getElementById('extendDrawing');
    extendBtn.hidden=!(kind==='trend'||kind==='arrow'||kind==='horizontalRay');
    extendBtn.classList.toggle('selected',!!selected.extendRight);

    const editTextBtn=document.getElementById('editDrawingText');
    editTextBtn.hidden=!(isNote||isText);
    editTextBtn.title=isNote?'Sửa nội dung ghi chú':'Sửa văn bản';

    const dupBtn=document.getElementById('duplicateDrawing');
    if(dupBtn)dupBtn.hidden=false;

    const lockBtn=document.getElementById('lockDrawing');
    lockBtn.disabled=false;
    lockBtn.classList.toggle('is-locked',isLocked);
    lockBtn.title=isLocked?'Đã khóa (Nhấn để mở khóa)':'Khóa hình vẽ';
    const lockLabel=document.getElementById('lockDrawingLabel');
    if(lockLabel)lockLabel.textContent=isLocked?'Đã khóa':'Khóa';
    const lockIcon=lockBtn.querySelector('.icon-lock');
    if(lockIcon)lockIcon.outerHTML=isLocked?drawingIcons.lock.replace('<svg ','<svg class="icon-lock" '):drawingIcons.lockOpen.replace('<svg ','<svg class="icon-lock" ');

    // When locked, disable ALL editing controls except the lock button!
    document.getElementById('deleteRange').disabled=isLocked;
    colorBtn.disabled=isLocked;
    if(fontColorBtn)fontColorBtn.disabled=isLocked;
    if(fontSizeBtn)fontSizeBtn.disabled=isLocked;
    if(widthBtn)widthBtn.disabled=isLocked;
    if(styleBtn)styleBtn.disabled=isLocked;
    extendBtn.disabled=isLocked;
    editTextBtn.disabled=isLocked;
    if(dupBtn)dupBtn.disabled=isLocked;

    const col=selected.color||'auto';
    document.getElementById('drawingColor').value=col;
    const fontCol=selected.fontColor||'#eeeeee';
    const fontColorInput=document.getElementById('drawingFontColor');
    if(fontColorInput)fontColorInput.value=fontCol;
    updateColorSwatchUI(col,fontCol);

    document.getElementById('undo').disabled=!undoStack.length;
    document.getElementById('redo').disabled=!redoStack.length;
    updateFloatingToolbarPosition();
  }
  function duplicateSelectedDrawing(){
    const d=drawings.find(x=>x.id===selectedId);
    if(!d||d.isLocked)return;
    pushUndo();
    const newId=globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;
    const clone=JSON.parse(JSON.stringify(d));
    clone.id=newId;
    clone.isLocked=false;
    if(clone.kind==='horizontal'){
      clone.startPrice=clone.startPrice*1.01;
      clone.endPrice=clone.startPrice;
    }else if(clone.kind==='vertical'){
      const nextTime=addTradingDays(clone.startTime,1);
      clone.startTime=nextTime;
      clone.endTime=nextTime;
    }else if(clone.kind==='pin'||clone.kind==='text'||clone.kind==='priceLabel'){
      const nextTime=addTradingDays(clone.startTime,1);
      clone.startTime=nextTime;
      clone.endTime=nextTime;
      clone.startPrice=clone.startPrice*1.006;
      clone.endPrice=clone.startPrice;
    }else{
      clone.startTime=addTradingDays(clone.startTime,1);
      clone.endTime=addTradingDays(clone.endTime,1);
      clone.startPrice=clone.startPrice*1.01;
      clone.endPrice=clone.endPrice*1.01;
    }
    drawings.push(clone);
    selectedId=newId;
    commitDrawings();
  }
  function snapshot(){return JSON.stringify(drawings)}function pushUndo(){undoStack.push(snapshot());if(undoStack.length>100)undoStack.shift();redoStack=[];updateDeleteButtons();}
  function commitDrawings(){if(payload)payload.drawings=JSON.parse(JSON.stringify(drawings));post({type:'priceRangesChanged',symbol:payload?.symbol,ranges:drawings});updateDeleteButtons();scheduleDraw();}

  function syncInlineEditorStyle(d){
    if(!d||inlineEditingDrawingId!==d.id)return;
    const editor=document.getElementById('inlineDrawingEditor'),input=document.getElementById('inlineDrawingInput'),tail=document.getElementById('inlineEditorTail');
    if(!editor||editor.hidden||!input)return;
    const isNote=d.kind==='pin';
    const isAutoColor=!d.color||d.color==='auto';
    const effectiveColor=isAutoColor?'#16816d':d.color;
    const fontCol=d.fontColor||'#ffffff';
    const fSize=Number(d.fontSize)||(isNote?12:13);
    input.style.fontSize=`${fSize}px`;
    input.style.color=fontCol;
    if(isNote){
      input.style.background=effectiveColor;
      input.style.borderColor='rgba(255,255,255,0.45)';
      if(tail){tail.hidden=false;tail.style.borderTopColor=effectiveColor;}
    }else{
      input.style.background='rgba(30,41,59,0.96)';
      input.style.borderColor=effectiveColor;
      if(tail)tail.hidden=true;
    }
    autoResizeInlineInput();
    positionInlineEditor(d);
  }
  function openDrawingColorPopover(target='color'){
    const isFont=target==='fontColor';
    const btn=document.getElementById(isFont?'drawingFontColorBtn':'drawingColorBtn');if(!btn)return;

    const existing=document.querySelector('.drawing-color-popover');
    if(existing&&existing._target===target){closeAllDrawingPopovers();return;}

        closeListener=null;
      }

    };

    const popW=210,popH=145;
    let popTop=btnRect.bottom+6;
    if(popTop+popH>window.innerHeight-10){popTop=Math.max(10,btnRect.top-popH-6);}
    let popLeft=Math.max(10,Math.min(window.innerWidth-popW-10,btnRect.left-popW/2+btnRect.width/2));

      :['#ffffff','#cbd5e1','#64748b','#0f172a','#3b82f6','#1d4ed8','#06b6d4','#0e7490','#10b981','#16816d','#22c55e','#65a30d','#f59e0b','#ea580c','#ef4444','#8b5cf6'];
    const currentColor=isFont?(selected?.fontColor||'#eeeeee'):(selected?.color||'auto');
    const isAuto=!isFont&&(!currentColor||currentColor==='auto');
    const titleText=isFont?'MÀU CHỮ GHI CHÚ':(selected?.kind==='pin'?'MÀU GHIM':'MÀU SẮC');
    const autoBtnHtml=isFont?'':`<button type="button" class="auto-color-btn${isAuto?' is-selected':''}"><span>✦ Tự động</span><span class="subtext">(Xanh/Đỏ theo nến)</span></button>`;
    pop.innerHTML=`<div class="pop-title">${titleText}</div>${autoBtnHtml}<div class="color-palette-grid">${paletteColors.map(c=>{const sel=currentColor.toLowerCase()===c.toLowerCase();return `<button type="button" class="palette-chip${sel?' is-selected':''}" data-color="${c}" style="background:${c}"></button>`;}).join('')}</div>`;
    ['pointerdown','pointerup','mousedown','mouseup','click','dblclick','touchstart','touchend'].forEach(evt=>{pop.addEventListener(evt,e=>e.stopPropagation());});
    if(!isFont){
      let autoHandled=false;
      const onAuto=e=>{
        if(autoHandled)return;
        autoHandled=true;
        if(e){e.preventDefault();e.stopPropagation();}
        const d=drawings.find(x=>x.id===selectedId);
        if(d&&!d.isLocked){pushUndo();d.color='auto';syncInlineEditorStyle(d);commitDrawings();}
        document.getElementById('drawingColor').value='auto';updateColorSwatchUI('auto',d?.fontColor);cleanup();
      };
      const autoBtn=pop.querySelector('.auto-color-btn');
      autoBtn?.addEventListener('pointerdown',onAuto);
      autoBtn?.addEventListener('click',onAuto);
    }
    pop.querySelectorAll('.palette-chip').forEach(chip=>{
      let chipHandled=false;
      const onChip=e=>{
        if(chipHandled)return;
        chipHandled=true;
        if(e){e.preventDefault();e.stopPropagation();}
        const col=chip.dataset.color;
        const d=drawings.find(x=>x.id===selectedId);
        if(d&&!d.isLocked){
          pushUndo();
          if(isFont)d.fontColor=col;else d.color=col;
          syncInlineEditorStyle(d);
          commitDrawings();
        }
        if(isFont){
          const fontInp=document.getElementById('drawingFontColor');if(fontInp)fontInp.value=col;
          updateColorSwatchUI(d?.color,col);
        }else{
          document.getElementById('drawingColor').value=col;
          updateColorSwatchUI(col,d?.fontColor);
        }
        cleanup();
      };
      chip.addEventListener('pointerdown',onChip);
      chip.addEventListener('click',onChip);
    });
    document.body.append(pop);
    closeListener=e=>{if(!pop.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){cleanup();}};
    setTimeout(()=>{if(pop.parentElement)window.addEventListener('pointerdown',closeListener,true);},10);

  function openDrawingMiniPopover(type){
    const d=drawings.find(x=>x.id===selectedId);
    if(!d||d.isLocked)return;
    const existing=document.querySelector('.floating-mini-popover');
    if(existing&&existing._type===type){closeAllDrawingPopovers();return;}
    closeAllDrawingPopovers();
    document.querySelectorAll('.style-popover').forEach(n=>n.remove());

    let btn=null,items=[];
    if(type==='width'){
      btn=document.getElementById('drawingWidthBtn');
      items=[
        {val:1,label:'1px',preview:'1px solid currentColor'},
        {val:2,label:'2px',preview:'2px solid currentColor'},
        {val:3,label:'3px',preview:'3px solid currentColor'},
        {val:4,label:'4px',preview:'4px solid currentColor'}
      ];
    }else if(type==='style'){
      btn=document.getElementById('drawingLineStyleBtn');
      items=[
        {val:'solid',label:'Liền',preview:'2px solid currentColor'},
        {val:'dashed',label:'Đứt',preview:'2px dashed currentColor'},
        {val:'dotted',label:'Chấm',preview:'2px dotted currentColor'}
      ];
    }else if(type==='fontSize'){
      btn=document.getElementById('drawingFontSizeBtn');
      items=[9,10,11,12,13,14,16,18,20,24].map(s=>({val:s,label:`${s}px`}));
    }
    if(!btn)return;

    const pop=document.createElement('div');
    pop.className='floating-mini-popover';pop._type=type;

    let cleanupListener=null;
    const cleanup=()=>{
      if(cleanupListener){
        window.removeEventListener('pointerdown',cleanupListener,true);
        cleanupListener=null;
      }
      pop.remove();
    };
    pop._cleanup=cleanup;

    items.forEach(it=>{
      const b=document.createElement('button');
      b.type='button';b.className='popover-item';
      const curVal=type==='width'?(d.lineWidth||1):type==='style'?(d.lineStyle||'solid'):(d.fontSize||(d.kind==='pin'?12:13));
      if(String(curVal)===String(it.val))b.classList.add('is-active');
      if(it.preview){
        b.innerHTML=`<span style="pointer-events:none;display:inline-block;width:32px;height:0;border-top:${it.preview};vertical-align:middle;margin-right:6px"></span><span style="pointer-events:none">${it.label}</span>`;
      }else{
        b.textContent=it.label;
      }
      let itemHandled=false;
      const selectItem=e=>{
        if(itemHandled)return;
        itemHandled=true;
        if(e){e.preventDefault();e.stopPropagation();}
        const targetDrawing=drawings.find(x=>x.id===selectedId)||d;
        if(!targetDrawing||targetDrawing.isLocked){cleanup();return;}
        pushUndo();
        if(type==='width'){
          const chosenWidth=Number(it.val)||1;
          targetDrawing.lineWidth=chosenWidth;
          const wSel=document.getElementById('drawingWidth');if(wSel)wSel.value=String(chosenWidth);
          const wLbl=document.getElementById('drawingWidthLabel');if(wLbl)wLbl.textContent=`${chosenWidth}px`;
          const wPrev=document.getElementById('drawingWidthPreview');if(wPrev)wPrev.style.borderTopWidth=`${chosenWidth}px`;
          if(btn)btn.title=`Độ dày đường nét (${chosenWidth}px)`;
        }else if(type==='style'){
          const chosenStyle=it.val||'solid';
          targetDrawing.lineStyle=chosenStyle;
          const sSel=document.getElementById('drawingLineStyle');if(sSel)sSel.value=chosenStyle;
          const sText=chosenStyle==='dashed'?'Đứt':(chosenStyle==='dotted'?'Chấm':'Liền');
          const sLbl=document.getElementById('drawingLineStyleLabel');if(sLbl)sLbl.textContent=sText;
          const sPrev=document.getElementById('drawingLineStylePreview');if(sPrev)sPrev.style.borderTopStyle=chosenStyle;
          if(btn)btn.title=`Kiểu nét: ${sText}`;
        }else if(type==='fontSize'){
          const chosen=Number(it.val)||(targetDrawing.kind==='pin'?12:13);
          targetDrawing.fontSize=chosen;
          const fSel=document.getElementById('drawingFontSize');if(fSel)fSel.value=String(chosen);
          const fLbl=document.getElementById('drawingFontSizeLabel');if(fLbl)fLbl.textContent=`${chosen}px`;
          if(btn)btn.title=`Cỡ chữ (${chosen}px)`;
          syncInlineEditorStyle(targetDrawing);
        }
        commitDrawings();
        cleanup();
      };
      b.addEventListener('pointerdown',selectItem);
      b.addEventListener('click',selectItem);
      pop.append(b);
    });

    ['pointerdown','pointerup','mousedown','mouseup','click','dblclick','touchstart','touchend'].forEach(evt=>{
      pop.addEventListener(evt,e=>e.stopPropagation());
    });

    const btnRect=btn.getBoundingClientRect();
    document.body.append(pop);
    const popRect=pop.getBoundingClientRect();
    let top=btnRect.bottom+6;
    if(top+popRect.height>window.innerHeight-10)top=Math.max(10,btnRect.top-popRect.height-6);
    let left=Math.max(10,Math.min(window.innerWidth-popRect.width-10,btnRect.left+btnRect.width/2-popRect.width/2));
    pop.style.top=`${Math.round(top)}px`;
    pop.style.left=`${Math.round(left)}px`;

    cleanupListener=e=>{
      if(!pop.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
        cleanup();
      }
    };
    setTimeout(()=>{
      if(pop.parentElement)window.addEventListener('pointerdown',cleanupListener,true);
    },10);
  }
